[workspace]
members = ["xkey-core"]

[package]
name = "ngx_xkey"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Surrogate-key (tag) based cache purging for nginx, in the spirit of Varnish xkey"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "xkey"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# Pinned rather than tracking a branch: nginx 1.30 support, which this module
# requires, landed in this commit and is not in a published release yet.
ngx = { git = "https://github.com/nginx/ngx-rust", rev = "cda9d8372ccd2e139ef2b03e5806e019e7796187", default-features = false, features = ["std"] }
nginx-sys = { git = "https://github.com/nginx/ngx-rust", rev = "cda9d8372ccd2e139ef2b03e5806e019e7796187" }
libc = "0.2"
xkey-core = { path = "xkey-core" }

[features]
default = ["export-modules", "ngx/vendored"]
# Required to build a loadable cdylib outside of the NGINX buildsystem.
export-modules = []

[profile.release]
lto = true
codegen-units = 1

# Profiles used by the NGINX buildsystem integration in auto/rust.
[profile.ngx-debug]
inherits = "dev"

[profile.ngx-release]
inherits = "release"
